# =============================================================================
# V8 configuration — the single source of truth for a run.
# Nothing that changes behaviour should be hard-coded in the source; it lives
# here so the same command always reproduces the same result.
# =============================================================================

project: v8-quant-football-model
seed: 42                      # fixes all randomness for reproducibility

data:
  sample_path: data/sample/sample_matches.csv   # tiny bundled sample (Phase 0)
  raw_dir: data/raw                             # real inputs (git-ignored)
  processed_dir: data/processed                 # canonical outputs (git-ignored)

  # --- Real data source (added 30 Sep 2026) ---------------------------------
  # football-data.co.uk publishes one CSV per league-season containing results,
  # shots, and both opening and CLOSING bookmaker odds. Closing odds are what
  # make CLV possible in Phase 6, which is why this source was chosen.
  source: football-data.co.uk
  leagues: ["E0"]                # E0 = English Premier League
  seasons: ["2324", "2425"]      # "2324" = the 2023/24 season
  file_pattern: "{league}_{season}.csv"          # how files are named in data/raw
  download_url: "https://www.football-data.co.uk/mmz4281/{season}/{league}.csv"

# Column contract for incoming match+odds data (football-data.co.uk style).
# Phase 1 will enforce this strictly; Phase 0 only checks the required columns.
schema:
  required_columns:
    - Date
    - HomeTeam
    - AwayTeam
    - FTHG          # full-time home goals
    - FTAG          # full-time away goals
    - FTR           # full-time result: H / D / A
  odds_columns:      # bookmaker odds we bet into
    - B365H
    - B365D
    - B365A
  closing_odds_columns:   # closing odds — used for CLV in Phase 6
    - PSCH
    - PSCD
    - PSCA

# --- Phase 1: validation rules ------------------------------------------------
# Every rule that decides whether a row is trustworthy lives here, not in code,
# so the contract can be read and challenged without opening a .py file.
validation:
  max_goals: 15              # more than this in one match is a data error, not a rout
  min_odds: 1.01             # decimal odds below this are impossible
  max_odds: 1000.0           # above this is a data error or a dead market
  drop_duplicate_fixtures: true   # same date + same two teams = the same match
  recompute_result: true     # trust the goals; rebuild H/D/A and report mismatches
  max_dropped_fraction: 0.05 # if we'd drop more than 5% of rows, stop and shout
  canonical_filename: matches.csv

# --- Phase 2: feature engineering --------------------------------------------
features:
  # Bayesian shrinkage strength. A team's estimate gets weight n/(n+k), so with
  # k=8 a team with 8 matches played sits exactly halfway between its own record
  # and the league average. Tuned by cross-validation in Phase 3; 8 is a sane
  # starting prior for a 38-match season.
  shrinkage_k: 8

  # Exponential time decay. A match this many days old counts half as much as a
  # match played today. 180 days ~ half a season: long enough to have data,
  # short enough to notice a squad that has changed.
  half_life_days: 180

  # Expected-goals proxy. The feature is a blend of what a team actually scored
  # and what its shots on target suggest it "should" have scored. 0.0 = goals
  # only, 1.0 = xG proxy only. Goals are the truth but are noisy; shots are
  # noisier per-event but far more plentiful.
  xg_weight: 0.5

  # Below this many prior matches, a team's estimate is flagged rather than
  # trusted. Phase 3 decides whether to train on those rows.
  min_prior_matches: 5

  feature_filename: features.csv

# Model settings (placeholders — tuned in their phases).
model:
  time_decay_half_life_days: 180   # Phase 3: likelihood weighting (see features.half_life_days)
  max_goals: 10                    # Phase 3: score-matrix truncation

  # L2 penalty on attack/defence parameters. This is Phase 2's Bayesian
  # shrinkage expressed as regularisation: with no evidence a team is pulled
  # toward 0, which on this log scale is exactly league average. Higher = more
  # sceptical. The direct analogue of a ridge-penalised PD model.
  penalty: 0.01

  # The optimiser runs from this many starting points. Agreement between them is
  # the evidence that the optimum found is global rather than lucky.
  n_starts: 3
  max_iterations: 500
  model_filename: dixon_coles.json

# --- Phase 4: probability calibration -----------------------------------------
calibration:
  # "platt" (two parameters: slope and intercept) or "isotonic" (any
  # non-decreasing step function). Platt is the safer choice on a few hundred
  # matches because it cannot fit much noise; isotonic can correct shapes Platt
  # cannot but will overfit a small sample. compare_methods() scores both out of
  # sample rather than taking this on trust.
  method: platt

  # Share of matches (chronologically EARLIEST) used to fit the calibration map.
  # The rest are held back to judge it. A random split would let the map learn
  # from matches that had not happened yet.
  fit_fraction: 0.5

  reliability_bins: 10
  calibration_filename: calibration.json

# --- Phase 5: staking ---------------------------------------------------------
staking:
  # Fraction of full Kelly to stake. The reason this is not 1.0 is NOT variance:
  # at twice the optimal stake, expected log growth is exactly zero, and beyond
  # it you lose money even with a real edge. Quarter-Kelly survives being wrong
  # about the model's probability by a factor of four before hitting that
  # boundary. See methodology section 5.2.
  kelly_fraction: 0.25

  starting_bankroll: 1000

  # Model probability must beat the DE-VIGGED market probability by this much.
  # Comparing against raw 1/odds instead would turn the bookmaker's margin into
  # phantom edge on every bet.
  min_edge: 0.02

  # How the bookmaker's margin is removed. "shin" corrects the
  # favourite-longshot bias (bookmakers load more margin onto longshots);
  # "proportional" assumes the margin is spread evenly and therefore overstates
  # longshot probabilities. Shin is the default for that reason.
  devig_method: shin

  # Risk limits, not part of Kelly. A single model probability can be badly
  # wrong, so no one bet and no one day should be able to matter this much.
  max_stake_fraction: 0.05      # per bet, as a share of bankroll
  max_daily_exposure: 0.15      # total across all bets on one date

# --- Phase 6: walk-forward backtest -------------------------------------------
backtest:
  # Matches that must exist before the first bet is eligible. Too low and the
  # early fits are built on almost nothing; too high and there is little history
  # left to test on.
  min_training_matches: 200

  # How often the model and calibration map are refitted. Refitting before every
  # match is the purest version and also what a real bettor could not do — the
  # model would change between two matches kicking off together. A cadence is
  # honest AND realistic: it is what someone running this weekly would have. The
  # cost is a model up to one window stale, which is a conservative error.
  refit_every_n_days: 14

  # Calibrate inside the walk-forward, on training history only. The subtle leak
  # this prevents: a map fitted on all the data has seen the outcomes of the
  # matches it is calibrating, and the effect is invisible in the output.
  calibrate: true
  min_calibration_matches: 150

  # Nothing in this project reports a betting metric without a confidence
  # interval. A yield of +3% over 200 bets and over 20,000 bets are entirely
  # different claims.
  bootstrap_resamples: 2000
  confidence_level: 0.95

logging:
  level: INFO
