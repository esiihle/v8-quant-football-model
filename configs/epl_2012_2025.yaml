# =============================================================================
# V8 — the long run: EPL 2012/13 to 2024/25 (13 seasons, 4,940 matches)
# =============================================================================
# Everything not stated here comes from ../config.yaml. That is deliberate: this
# run must differ from the headline in ONE way - how much history it sees - so
# any difference in results is attributable to that and nothing else.
#
# 13 seasons is every EPL season whose football-data file carries Pinnacle
# closing odds, which CLV needs. Rebuild the files with
#   python scripts/rebuild_raw_from_mirrors.py --odds ../mirror-odds
#       --shots ../mirror-shots --seasons 1213 1314 ... 2425
# Run with
#   python scripts/run_pipeline.py --config configs/epl_2012_2025.yaml
#   python scripts/make_charts.py  --config configs/epl_2012_2025.yaml
#       --out docs/charts/epl_2012_2025
extends: ../config.yaml

data:
  seasons: ["1213", "1314", "1415", "1516", "1617", "1718", "1819",
            "1920", "2021", "2122", "2223", "2324", "2425"]
